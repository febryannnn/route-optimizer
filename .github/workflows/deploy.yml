name: Deploy App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ======================
      # FRONTEND
      # ======================

      - name: Build Frontend
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.VPS_HOST }}:5000 \
            -t ${{ secrets.DOCKER_USERNAME }}/frontend:latest \
            ./frontend

      - name: Push Frontend
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/frontend:latest

      # ======================
      # BACKEND
      # ======================

      - name: Build Backend
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/backend:latest \
            ./backend

      - name: Push Backend
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/backend:latest

      # ======================
      # DEPLOY VPS
      # ======================

      - name: Deploy VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            cd /var/www/app

            docker compose pull

            docker compose up -d

            docker image prune -f